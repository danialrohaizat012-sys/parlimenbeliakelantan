<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MANDAT Kelantan | CMS Admin</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#14254b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#07183c;color:white;padding:18px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header strong{font-size:1.1rem}main{max-width:1100px;margin:32px auto;padding:0 20px}.panel{background:white;border:1px solid #dce4ef;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 8px 30px #14254b0a}h1{font-size:1.6rem;margin:0 0 12px}h2{font-size:1.2rem}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;border:1px solid #c7d2e2;border-radius:9px;padding:11px;font:inherit;color:#14254b}textarea{min-height:105px}button{background:#123d8d;color:white;border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e8eef8;color:#123d8d}.danger{background:#a22b3b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs button.active{background:#07183c}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.item{border:1px solid #dce4ef;padding:16px;border-radius:12px}.item h3{margin:0 0 8px}.muted{color:#60718d;font-size:.9rem}.hidden{display:none!important}#notice{position:sticky;top:0;z-index:5;padding:12px 20px;background:#fff4c7;color:#4b3a00;display:none}#notice.show{display:block}a{color:#174da0} .form-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}@media(max-width:600px){main{margin:18px auto}.panel{padding:18px}}
</style></head><body>
<header><strong>MANDAT KELANTAN <span style="color:#ffce28">/ CMS</span></strong><div><span id="who"></span> <button id="logout" class="secondary hidden">Log keluar</button></div></header>
<div id="notice" role="status" aria-live="polite"></div>
<main><section id="loginPanel" class="panel"><h1>Log masuk pentadbir</h1><p class="muted">Hanya akaun yang diberi akses CMS boleh mengurus kandungan.</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required value="adminmandatkelantan@gmail.com"><label>Kata laluan</label><input id="password" type="password" autocomplete="current-password" required><div class="form-actions"><button type="submit">Log masuk</button><button type="button" id="reset" class="secondary">Reset kata laluan</button></div></form></section>
<section id="app" class="hidden"><div class="row"><div><h1>Content Management</h1><p class="muted">Urus calon, berita dan program. Perubahan disimpan terus ke Supabase.</p></div><a href="./index.html" target="_blank" rel="noopener">Lihat website ↗</a></div>
<div class="tabs"><button data-tab="candidates" class="active">14 Calon</button><button data-tab="articles">Berita</button><button data-tab="events">Program</button></div>
<section id="candidates" class="panel"><h2>Profil calon</h2><div id="candidateList" class="grid"></div><form id="candidateForm" class="hidden"><h2>Edit calon #<span id="candidateNumber"></span></h2><label>Nama</label><input id="candidateName" required minlength="3" maxlength="200"><label>Jawatan / peranan</label><input id="candidateRole"><label>Biografi</label><textarea id="candidateBio"></textarea><label>Photo path (Storage)</label><input id="candidatePhoto" placeholder="candidate-1.jpg"><div class="form-actions"><button type="submit">Simpan perubahan</button><button type="button" class="secondary" id="cancelCandidate">Batal</button></div></form></section>
<section id="articles" class="panel hidden"><div class="row"><h2>Berita</h2><button id="newArticle">+ Berita baharu</button></div><div id="articleList" class="grid"></div><form id="articleForm" class="hidden"><h2 id="articleHeading">Berita</h2><label>Tajuk</label><input id="articleTitle" required minlength="3" maxlength="200"><label>Ringkasan</label><textarea id="articleExcerpt"></textarea><label>Kandungan</label><textarea id="articleBody"></textarea><label>Cover path</label><input id="articleCover"><label>Status</label><select id="articleStatus"><option value="draft">Draf</option><option value="published">Terbit</option></select><div class="form-actions"><button type="submit">Simpan berita</button><button type="button" class="secondary" id="cancelArticle">Batal</button></div></form></section>
<section id="events" class="panel hidden"><div class="row"><h2>Program</h2><button id="newEvent">+ Program baharu</button></div><div id="eventList" class="grid"></div><form id="eventForm" class="hidden"><h2>Maklumat program</h2><label>Nama program</label><input id="eventTitle" required minlength="3" maxlength="200"><label>Penerangan</label><textarea id="eventDescription"></textarea><label>Lokasi</label><input id="eventLocation"><label>Tarikh dan masa</label><input id="eventDate" type="datetime-local"><label>URL pendaftaran</label><input id="eventUrl" type="url"><label>Status</label><select id="eventStatus"><option value="draft">Draf</option><option value="published">Terbit</option></select><div class="form-actions"><button type="submit">Simpan program</button><button type="button" class="secondary" id="cancelEvent">Batal</button></div></form></section></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://znyruucppnhencsgyugu.supabase.co','sb_publishable_tbBNCvOQoeB1c_wE1amacQ_4FIOtrYP');
const $=id=>document.getElementById(id), state={candidate:null,article:null,event:null}, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(s){$('notice').textContent=s;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),6000)}
async function check(){const {data:{user}}=await db.auth.getUser();if(!user){$('app').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('logout').classList.add('hidden');return}const {data,error}=await db.from('cms_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){notice('Akaun ini tiada kebenaran CMS.');await db.auth.signOut();return check()}$('who').textContent=user.email;$('logout').classList.remove('hidden');$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');await load('candidates')}
$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return notice(error.message);await check()};
$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email)return notice('Masukkan email dahulu');const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href});notice(error?error.message:'Semak email untuk arahan reset kata laluan.')};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['candidates','articles','events'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));load(b.dataset.tab)});
async function rows(table){const {data,error}=await db.from(table).select('*').order(table==='cms_candidates'?'id':'created_at',{ascending:table==='cms_candidates'});if(error)throw error;return data}
function card(title,detail,onClick){const el=document.createElement('div');el.className='item';el.innerHTML='<h3>'+esc(title)+'</h3><p class="muted">'+esc(detail)+'</p>';const b=document.createElement('button');b.textContent='Edit';b.onclick=onClick;el.append(b);return el}
async function load(tab){try{if(tab==='candidates'){const data=await rows('cms_candidates');$('candidateList').replaceChildren(...data.map(c=>card(c.name,'Calon #'+c.id+' · '+(c.role_title||''),()=>{state.candidate=c.id;$('candidateNumber').textContent=c.id;$('candidateName').value=c.name;$('candidateRole').value=c.role_title||'';$('candidateBio').value=c.bio||'';$('candidatePhoto').value=c.photo_path||'';$('candidateForm').classList.remove('hidden');$('candidateForm').scrollIntoView({behavior:'smooth'})})))}
if(tab==='articles'){const data=await rows('cms_articles');$('articleList').replaceChildren(...data.map(a=>card(a.title,a.status,()=>editArticle(a))))}
if(tab==='events'){const data=await rows('cms_events');$('eventList').replaceChildren(...data.map(a=>card(a.title,a.status,()=>editEvent(a))))}}catch(e){notice(e.message)}}
$('cancelCandidate').onclick=()=>$('candidateForm').classList.add('hidden');
$('candidateForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('cms_candidates').update({name:$('candidateName').value.trim(),role_title:$('candidateRole').value,bio:$('candidateBio').value,photo_path:$('candidatePhoto').value||null,updated_at:new Date().toISOString()}).eq('id',state.candidate);if(error)return notice(error.message);notice('Profil calon disimpan');$('candidateForm').classList.add('hidden');load('candidates')};
function editArticle(a={}){state.article=a.id||null;$('articleTitle').value=a.title||'';$('articleExcerpt').value=a.excerpt||'';$('articleBody').value=a.body||'';$('articleCover').value=a.cover_path||'';$('articleStatus').value=a.status||'draft';$('articleForm').classList.remove('hidden')}
$('newArticle').onclick=()=>editArticle();$('cancelArticle').onclick=()=>$('articleForm').classList.add('hidden');
$('articleForm').onsubmit=async e=>{e.preventDefault();const status=$('articleStatus').value;const value={title:$('articleTitle').value.trim(),excerpt:$('articleExcerpt').value,body:$('articleBody').value,cover_path:$('articleCover').value||null,status,updated_at:new Date().toISOString()};if(status==='published')value.published_at=new Date().toISOString();const q=state.article?db.from('cms_articles').update(value).eq('id',state.article):db.from('cms_articles').insert(value);const {error}=await q;if(error)return notice(error.message);notice('Berita disimpan');$('articleForm').classList.add('hidden');load('articles')};
function editEvent(a={}){state.event=a.id||null;$('eventTitle').value=a.title||'';$('eventDescription').value=a.description||'';$('eventLocation').value=a.location||'';$('eventDate').value=a.starts_at?new Date(a.starts_at).toISOString().slice(0,16):'';$('eventUrl').value=a.registration_url||'';$('eventStatus').value=a.status||'draft';$('eventForm').classList.remove('hidden')}
$('newEvent').onclick=()=>editEvent();$('cancelEvent').onclick=()=>$('eventForm').classList.add('hidden');
$('eventForm').onsubmit=async e=>{e.preventDefault();const value={title:$('eventTitle').value.trim(),description:$('eventDescription').value,location:$('eventLocation').value,starts_at:$('eventDate').value?new Date($('eventDate').value).toISOString():null,registration_url:$('eventUrl').value,status:$('eventStatus').value,updated_at:new Date().toISOString()};const q=state.event?db.from('cms_events').update(value).eq('id',state.event):db.from('cms_events').insert(value);const {error}=await q;if(error)return notice(error.message);notice('Program disimpan');$('eventForm').classList.add('hidden');load('events')};
check();
</script></body></html>
